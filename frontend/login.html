<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in | SkillSwap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-art d-none d-lg-flex">
      <a href="index.html" class="brand">Skill<span>Swap</span></a>
      <div>
        <h1>Your next skill is one swap away.</h1>
        <div class="arch-note mt-4"><b>2 free credits</b><small>waiting for new members</small></div>
        <div class="arch-note"><b>Verified teachers</b><small>every skill is checked by admin</small></div>
      </div>
    </div>

    <div class="auth-form">
      <div class="auth-box">
        <h2>Welcome back</h2>
        <p class="text-muted mb-4">Log in to continue swapping.</p>
        <div id="alertBox" class="alert d-none"></div>

        <form id="loginForm">
          <label class="form-label">Email</label>
          <input id="email" type="email" class="form-control" placeholder="name@college.edu" required />
          <label class="form-label mt-3">Password</label>
          <input id="password" type="password" class="form-control" placeholder="Your password" required />
          <button class="btn-main w-100 mt-4">Log in</button>
        </form>

        <p class="mt-4 text-center text-muted">New here? <a href="register.html" class="auth-link">Create an account</a></p>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
