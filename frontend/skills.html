<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My skills | SkillSwap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="navbar"></div>

  <main class="container pb-5">
    <h1 class="page-title">My skills</h1>

    <div class="row g-4">
      <div class="col-lg-5">
        <div class="panel">
          <h3>Add a skill</h3>
          <div id="alertBox" class="alert d-none"></div>

          <form id="skillForm">
            <label class="form-label">Skill name</label>
            <input id="skillName" class="form-control soft-input" placeholder="Java, Video editing, Guitar" required />

            <label class="form-label mt-3">I want to</label>
            <div class="type-toggle">
              <input type="radio" name="type" id="tTeach" value="teach" checked />
              <label for="tTeach">Teach this</label>
              <input type="radio" name="type" id="tLearn" value="learn" />
              <label for="tLearn">Learn this</label>
            </div>

            <div id="proofBox">
              <label class="form-label mt-3">Proof link (GitHub, portfolio, certificate)</label>
              <input id="proofLink" class="form-control soft-input" placeholder="https://github.com/yourname" />
              <label class="form-label mt-3">Or upload proof (jpg, png, pdf, max 2MB)</label>
              <input id="proofFile" type="file" class="form-control soft-input" accept=".jpg,.jpeg,.png,.pdf" />
              <small class="text-muted d-block mt-2">Admin checks your proof before you can teach.</small>
            </div>

            <button class="btn-main w-100 mt-4">Add skill</button>
          </form>
        </div>
      </div>

      <div class="col-lg-7">
        <div class="panel">
          <h3>I can teach</h3>
          <div id="teachList"><p class="text-muted">Loading...</p></div>
        </div>
        <div class="panel mt-4">
          <h3>I want to learn</h3>
          <div id="learnList"><p class="text-muted">Loading...</p></div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/skills.js"></script>
</body>
</html>
