<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sessions | SkillSwap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="navbar"></div>

  <main class="container pb-5">
    <h1 class="page-title">Sessions</h1>
    <div id="alertBox" class="alert d-none"></div>

    <div class="row g-4">
      <div class="col-lg-5">
        <div class="panel">
          <h3>Create a slot</h3>
          <p class="text-muted small">Pick one of your verified skills and add a meeting link.</p>
          <form id="slotForm">
            <label class="form-label">Skill</label>
            <select id="slotSkill" class="form-select soft-input" required></select>
            <div class="row g-2 mt-1">
              <div class="col-6"><label class="form-label">Date</label><input id="slotDate" type="date" class="form-control soft-input" required /></div>
              <div class="col-6"><label class="form-label">Time</label><input id="slotTime" type="time" class="form-control soft-input" required /></div>
            </div>
            <label class="form-label mt-3">Meeting link (Google Meet / Zoom)</label>
            <input id="slotLink" class="form-control soft-input" placeholder="https://meet.google.com/abc-defg-hij" required />
            <button class="btn-main w-100 mt-4">Create slot</button>
          </form>
        </div>

        <div class="panel mt-4">
          <h3>Find a session</h3>
          <div class="d-flex gap-2 mb-2">
            <input id="filterSkill" class="form-control soft-input" placeholder="Filter by skill, e.g. java" />
            <button class="btn-soft sm" id="filterBtn">Search</button>
          </div>
          <div id="available"><p class="text-muted">Loading...</p></div>
        </div>
      </div>

      <div class="col-lg-7">
        <div class="panel">
          <h3>My sessions</h3>
          <div id="mySessions"><p class="text-muted">Loading...</p></div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/sessions.js"></script>
</body>
</html>
