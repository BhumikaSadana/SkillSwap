<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Join | SkillSwap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-art d-none d-lg-flex">
      <a href="index.html" class="brand">Skill<span>Swap</span></a>
      <div>
        <h1>Teach what you know. Learn what you don't.</h1>
        <div class="arch-note mt-4"><b>+1 credit</b><small>for every session you teach</small></div>
        <div class="arch-note"><b>No money involved</b><small>time is the only currency</small></div>
      </div>
    </div>

    <div class="auth-form">
      <div class="auth-box">
        <h2>Create your account</h2>
        <p class="text-muted mb-4">Takes less than a minute.</p>
        <div id="alertBox" class="alert d-none"></div>

        <form id="registerForm">
          <label class="form-label">Full name</label>
          <input id="name" type="text" class="form-control" placeholder="Your name" required />
          <label class="form-label mt-3">Email</label>
          <input id="email" type="email" class="form-control" placeholder="name@college.edu" required />
          <label class="form-label mt-3">Password</label>
          <input id="password" type="password" class="form-control" placeholder="At least 6 characters" minlength="6" required />
          <button class="btn-main w-100 mt-4">Create account</button>
        </form>

        <p class="mt-4 text-center text-muted">Already a member? <a href="login.html" class="auth-link">Log in</a></p>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
