<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin | SkillSwap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="navbar"></div>

  <main class="container pb-5">
    <h1 class="page-title">Admin panel</h1>
    <div id="alertBox" class="alert d-none"></div>

    <div class="row g-3">
      <div class="col-6 col-lg"><div class="stat" style="background:#cfeee2"><small>Total users</small><b id="stUsers">0</b></div></div>
      <div class="col-6 col-lg"><div class="stat" style="background:#ffe7a8"><small>Pending skills</small><b id="stPending">0</b></div></div>
      <div class="col-6 col-lg"><div class="stat" style="background:#e6dcfb"><small>Verified skills</small><b id="stApproved">0</b></div></div>
      <div class="col-6 col-lg"><div class="stat" style="background:#ffdad3"><small>Sessions</small><b id="stSessions">0</b></div></div>
      <div class="col-6 col-lg"><div class="stat" style="background:#d6eefb"><small>Completed</small><b id="stDone">0</b></div></div>
    </div>

    <div class="panel mt-4">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-2">
        <h3 class="mb-0">Skill requests</h3>
        <div class="type-toggle" style="width:320px">
          <input type="radio" name="flt" id="fPending" value="pending" checked /><label for="fPending">Pending</label>
          <input type="radio" name="flt" id="fApproved" value="approved" /><label for="fApproved">Verified</label>
          <input type="radio" name="flt" id="fRejected" value="rejected" /><label for="fRejected">Rejected</label>
        </div>
      </div>
      <div id="skillList"><p class="text-muted">Loading...</p></div>
    </div>

    <div class="panel mt-4">
      <h3>All users</h3>
      <div id="userList"><p class="text-muted">Loading...</p></div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
